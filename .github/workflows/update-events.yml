name: CardCircle-Events aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich gegen 6 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_events.py
      - name: Änderungen speichern
        run: |
          if ! git diff --quiet data/events.json; then
            git config user.name "mau-e Event-Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/events.json
            git commit -m "Events von cardcircle.eu aktualisiert"
            git pull --rebase origin main
            git push
          else
            echo "Keine Änderungen."
          fi
