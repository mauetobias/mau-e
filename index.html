<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tobias Maue</title>
  <meta name="description" content="Persönliche Webseite von Tobias Maue – hier entsteht gerade etwas Neues.">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1d1d1b;
      --muted: #6b6a66;
      --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --fg: #f1efe9; --muted: #9a988f; --accent: #fb923c; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 34rem; }
    h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .dot { color: var(--accent); }
    p { margin-top: 1.1rem; font-size: 1.15rem; line-height: 1.6; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Tobias Maue<span class="dot">.</span></h1>
    <p>Hier entsteht gerade eine neue Seite. Schau bald wieder vorbei.</p>
  </main>
</body>
</html>
